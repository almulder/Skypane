<!-- the panel's night sky behind it (as the Manager's sign-in page): moon, stars, three ridges -->

<main class="wrap">

    <section id="pair" class="pair" aria-live="polite"></section>

<noscript><p class="nojs">Skypane needs JavaScript.</p></noscript>
<script src="/layouts/v4/shared/strings/en.js"></script><!-- the panel's words (the same table as the panels) -->
