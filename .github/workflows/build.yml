# Skypane image: built when a release tag (v3.0.0, v3.0.1, ...) is pushed, or by hand (Actions -> build -> Run workflow),
# and pushed to ghcr.io/almulder/skypane as :<version> and :latest (+ :sha-<short commit>; a hand-started run off main: :sha only). The tests run in the private
# development repository before every export, so none are here. Uses the built-in GITHUB_TOKEN — no stored secrets.
# Actions are pinned to full commit SHAs (version in the comment); the checkout doesn't keep the token.
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/almulder/skypane

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Version and tags
        id: vars
        run: |
          short="${GITHUB_SHA::7}"
          version="$(tr -d '[:space:]' < service/RELEASE)"
          case "$version" in (*[!0-9.]*|"") echo "service/RELEASE is not a version: $version"; exit 1;; esac
          # a release tag must name the version in service/RELEASE (v3.0.0 ⇔ 3.0.0) — never an image under the wrong number
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "The tag $GITHUB_REF_NAME doesn't match service/RELEASE ($version): expected v$version"; exit 1
          fi
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<TAGS"
            # :<version> and :latest only from a release tag or a hand-started run on main; any other hand-started run
            # gets only its :sha-<commit> tag (never moves :latest or a release number)
            if [ "$GITHUB_REF_TYPE" = "tag" ] || [ "$GITHUB_REF" = "refs/heads/main" ]; then
              echo "$IMAGE:$version"
              echo "$IMAGE:latest"
            fi
            echo "$IMAGE:sha-$short"
            echo "TAGS"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=sha-${{ steps.vars.outputs.short }}
          tags: ${{ steps.vars.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Skypane
            org.opencontainers.image.source=https://github.com/almulder/Skypane
            org.opencontainers.image.url=https://github.com/almulder/Skypane
            org.opencontainers.image.version=${{ steps.vars.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=LicenseRef-AllRightsReserved
